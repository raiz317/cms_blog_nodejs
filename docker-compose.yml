version: '3.9'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cms_db
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend/admin:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongo-data: